name: Go/Python Parity

# The gate SPEC.md V10 requires: Python becomes the default runtime only once
# the required parity cases pass in CI.
#
# Note this file's location. kb-core-ui/.github/workflows/ also holds
# workflows, left over from when kb-core-ui was its own repository; GitHub
# only reads .github/ at the repository root, so those are inert here and
# this is the only workflow that actually runs.

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kb-core-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: kb-core-ui/legacy/go/go.mod
          cache-dependency-path: kb-core-ui/legacy/go/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The harness finds the oracle next to go.mod, under either name.
      - name: Build the Go oracle
        working-directory: kb-core-ui/legacy/go
        run: go build -o kb-core-ui ./cmd/kb-core-ui

      - name: Test the Go oracle
        # Parity is only meaningful if the oracle itself is sound.
        # The archived module no longer contains malformed harness fixtures.
        working-directory: kb-core-ui/legacy/go
        run: go test ./...

      - name: Install the Python port and the harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python
          python -m pip install -e ./harness
          python -m pip install pytest

      - name: Python port tests
        working-directory: kb-core-ui/python
        run: python -m pytest -q

      - name: Harness tests
        working-directory: kb-core-ui/harness
        run: python -m pytest -q

      # The gate. Runs both engines as separate processes against the same
      # fixtures and fails on any unexplained difference.
      #
      # `parity` compares Go against Python on one machine, so it is
      # platform-independent. `verify` is deliberately NOT run here: it
      # replays baselines recorded on a developer's machine, and some
      # recorded values are legitimately platform-specific -- Go and Python
      # both read the OS mime table, so a .js asset is application/javascript
      # on Windows and text/javascript on a stock Linux one (SPEC.md B11).
      # Both engines still agree with each other, which is what V10 asks for.
      - name: Go vs Python parity
        working-directory: kb-core-ui/harness
        run: python -m harness parity --oracle go --candidate python

      - name: Upload the parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: kb-core-ui/harness/.harness-work/runs/*/report.json
          if-no-files-found: warn

  web-contract:
    # V9: React keeps working against Python without TypeScript API contract
    # changes. A type error in web/src/api/client.ts is the first sign the
    # contract moved.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kb-core-ui/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kb-core-ui/web/package-lock.json

      - run: npm ci

      - name: Typecheck the API client
        run: npx tsc -b --force
