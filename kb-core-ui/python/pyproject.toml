[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-core-ui"
version = "0.1.0"
description = "Python port of the kb-core-ui code knowledge graph (spec/SPEC.md T5-T12)"
requires-python = ">=3.10"
# Grammar versions are pinned exactly, not floored. The parser's output IS
# the contract here, and a grammar release changes it: spec/SPEC.md B3 was a doc
# comment attaching to the wrong symbol purely because tree-sitter-go 0.25
# shapes trailing comments differently from the pinned smacker grammar the Go
# side uses. A `>=` floor would let CI install a newer grammar than parity was
# ever proven against and fail with a diff that looks like a port bug.
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kb-core-ui = "kb_core_ui.__main__:main"

[tool.setuptools.packages.find]
include = ["kb_core_ui*"]
